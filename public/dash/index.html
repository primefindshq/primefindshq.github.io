<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PF Stats" />
<meta name="theme-color" content="#0b0b0c" />
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png" />
<link rel="manifest" href="/dash/manifest.webmanifest" />
<title>PRIME.FINDS · נתונים</title>
<!-- Owner dashboard. Not linked from the site, not indexed, and it does not load the
     analytics script, so opening it never counts as a visit. Reads the public,
     read-only Umami share link (the same data the share URL shows). -->
<style>
  :root {
    --bg: #0b0b0c; --card: #151517; --line: #26262a; --text: #f2efe8; --dim: #8d8a83;
    --gold: #d6b25e; --green: #5fd38d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 560px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 17px; letter-spacing: .06em; font-weight: 700; }
  h1 span { color: var(--gold); }
  .live { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--dim); }
  .live b { color: var(--text); font-size: 15px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(95,211,141,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(95,211,141,0); } 100% { box-shadow: 0 0 0 0 rgba(95,211,141,0); } }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
  .tabs button { background: none; border: 0; color: var(--dim); font: inherit; font-size: 14px; padding: 8px 0; border-radius: 9px; }
  .tabs button.on { background: #24242a; color: var(--text); font-weight: 600; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
  .kpi small { color: var(--dim); font-size: 12.5px; display: block; }
  .kpi strong { font-size: 27px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .kpi.hero { border-color: rgba(214,178,94,.45); }
  .kpi.hero strong { color: var(--gold); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 10px; letter-spacing: .02em; }
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 90px; direction: ltr; }
  .chart i { flex: 1; background: #3a3a40; border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart i.c { background: var(--gold); }
  .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-top: 6px; direction: ltr; }
  .rows { list-style: none; padding: 0; }
  .rows li { position: relative; display: flex; justify-content: space-between; gap: 10px; padding: 7px 8px; font-size: 14px; border-radius: 7px; overflow: hidden; }
  .rows li .bar { position: absolute; inset: 0 0 0 auto; background: rgba(214,178,94,.13); z-index: 0; }
  .rows li span { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows li span:last-child { flex-shrink: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
  .empty { color: var(--dim); font-size: 13.5px; padding: 4px 8px; }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 6px; }
  footer button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; margin-top: 8px; }
  .err { color: #ff8a7a; }
</style>
</head>
<body>
<header>
  <h1>PRIME<span>.</span>FINDS</h1>
  <div class="live"><span class="dot"></span><b id="active">–</b> באתר עכשיו</div>
</header>

<div class="tabs" role="tablist">
  <button data-range="today" class="on">היום</button>
  <button data-range="7">7 ימים</button>
  <button data-range="30">30 יום</button>
</div>

<div class="kpis">
  <div class="kpi hero"><small>לחיצות לאמזון</small><strong id="k-clicks">–</strong></div>
  <div class="kpi"><small>מבקרים</small><strong id="k-visitors">–</strong></div>
  <div class="kpi"><small>צפיות בדפים</small><strong id="k-views">–</strong></div>
  <div class="kpi"><small>אחוז מבקרים שלחצו</small><strong id="k-ctr">–</strong></div>
</div>

<div class="card">
  <h2 id="chart-title">מבקרים לאורך היום</h2>
  <div class="chart" id="chart"></div>
  <div class="axis" id="axis"></div>
</div>

<div class="card"><h2>המוצרים שהכי לוחצים עליהם</h2><ul class="rows" id="products"></ul></div>
<div class="card"><h2>מאיפה מגיעים</h2><ul class="rows" id="referrers"></ul></div>
<div class="card"><h2>הדפים הנצפים ביותר</h2><ul class="rows" id="pages"></ul></div>
<div class="card"><h2>מדינות</h2><ul class="rows" id="countries"></ul></div>
<div class="card"><h2>מכשירים</h2><ul class="rows" id="devices"></ul></div>

<footer>
  <div id="updated">טוען…</div>
  <button id="refresh" type="button">רענון</button>
</footer>

<script>
(() => {
  const API = 'https://gateway-us.umami.is/api';
  const SHARE_ID = 'rP9J4eWbdzJefJin';
  const TZ = 'Asia/Jerusalem';
  let auth = null, range = 'today';
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n || 0).toLocaleString('he-IL');
  const regionName = (() => { try { const d = new Intl.DisplayNames(['he'], { type: 'region' }); return (c) => d.of(c) || c; } catch { return (c) => c; } })();
  const DEVICES = { mobile: 'נייד', desktop: 'מחשב', tablet: 'טאבלט', laptop: 'לפטופ' };

  async function getAuth() {
    const r = await fetch(`${API}/share/${SHARE_ID}`);
    if (!r.ok) throw new Error('share ' + r.status);
    const j = await r.json();
    auth = { id: j.websiteId, headers: { 'x-umami-share-token': j.token, 'x-umami-share-context': '1' } };
  }
  async function api(path) {
    if (!auth) await getAuth();
    let r = await fetch(`${API}/websites/${auth.id}${path}`, { headers: auth.headers });
    if (r.status === 401) { await getAuth(); r = await fetch(`${API}/websites/${auth.id}${path}`, { headers: auth.headers }); }
    if (!r.ok) throw new Error(path.split('?')[0] + ' ' + r.status);
    return r.json();
  }

  function window_() {
    const end = Date.now();
    const start = new Date();
    if (range === 'today') start.setHours(0, 0, 0, 0);
    else { start.setDate(start.getDate() - (Number(range) - 1)); start.setHours(0, 0, 0, 0); }
    return { startAt: start.getTime(), endAt: end, unit: range === 'today' ? 'hour' : 'day' };
  }

  function rows(el, items, label, max = 8) {
    const list = items.slice(0, max);
    if (!list.length) { el.innerHTML = '<li class="empty">אין נתונים עדיין</li>'; return; }
    const top = Math.max(...list.map((i) => i.y));
    el.innerHTML = list.map((i) => {
      const t = label(i.x);
      return `<li><i class="bar" style="width:${(i.y / top) * 100}%"></i><span title="${t.replace(/"/g, '&quot;')}">${t}</span><span>${fmt(i.y)}</span></li>`;
    }).join('');
  }
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const pageLabel = (p) => {
    if (!p || p === '/') return 'דף הבית';
    const m = p.match(/^\/(product|category|v|collection)\/([^/]+)/);
    const kind = { product: '', category: 'קטגוריה: ', v: 'סרטון: ', collection: 'אוסף: ' };
    if (m) return esc(kind[m[1]] + m[2].replace(/-/g, ' '));
    return esc(p);
  };
  const refLabel = (r) => {
    if (!r) return 'ישיר / אפליקציה';
    const host = r.replace(/^www\./, '');
    if (/instagram/.test(host)) return 'Instagram';
    if (/tiktok/.test(host)) return 'TikTok';
    if (/facebook|fb\./.test(host)) return 'Facebook';
    if (/youtube|youtu\.be/.test(host)) return 'YouTube';
    if (/pinterest/.test(host)) return 'Pinterest';
    if (/google/.test(host)) return 'Google';
    return esc(host);
  };

  function chart(series, unit) {
    const pts = series || [];
    const el = $('chart');
    if (!pts.length) { el.innerHTML = ''; $('axis').innerHTML = ''; return; }
    const max = Math.max(1, ...pts.map((p) => p.y));
    el.innerHTML = pts.map((p) => `<i class="${p.y ? 'c' : ''}" style="height:${Math.max(2, (p.y / max) * 100)}%" title="${p.x}: ${p.y}"></i>`).join('');
    const lab = (x) => unit === 'hour' ? String(new Date(x.replace(' ', 'T')).getHours()).padStart(2, '0') + ':00' : x.slice(5, 10).split('-').reverse().join('/');
    $('axis').innerHTML = `<span>${lab(pts[0].x)}</span><span>${lab(pts[pts.length - 1].x)}</span>`;
  }

  async function load() {
    $('updated').textContent = 'מעדכן…';
    try {
      const { startAt, endAt, unit } = window_();
      const q = `startAt=${startAt}&endAt=${endAt}`;
      const [stats, events, series, refs, pages, countries, devices, active] = await Promise.all([
        api(`/stats?${q}`),
        api(`/metrics?${q}&type=event&limit=500`),
        api(`/pageviews?${q}&unit=${unit}&timezone=${encodeURIComponent(TZ)}`),
        api(`/metrics?${q}&type=referrer&limit=10`),
        api(`/metrics?${q}&type=path&limit=10`),
        api(`/metrics?${q}&type=country&limit=10`),
        api(`/metrics?${q}&type=device&limit=10`),
        api('/active').catch(() => null),
      ]);
      const val = (v) => (v && typeof v === 'object' ? v.value : v) || 0;
      const clicksList = (events || []).filter((e) => /^Amazon: /.test(e.x));
      const clicks = clicksList.reduce((s, e) => s + e.y, 0);
      const visitors = val(stats.visitors);
      $('k-clicks').textContent = fmt(clicks);
      $('k-visitors').textContent = fmt(visitors);
      $('k-views').textContent = fmt(val(stats.pageviews));
      $('k-ctr').textContent = visitors ? Math.round((Math.min(clicks, visitors) / visitors) * 100) + '%' : '–';
      const act = Array.isArray(active) ? (active[0]?.x ?? 0) : (active?.visitors ?? active?.x ?? 0);
      $('active').textContent = fmt(act);
      $('chart-title').textContent = range === 'today' ? 'מבקרים לאורך היום' : 'מבקרים לפי יום';
      chart(series.sessions || series.pageviews, unit);
      rows($('products'), clicksList, (x) => esc(x.replace(/^Amazon: /, '')), 10);
      rows($('referrers'), refs || [], refLabel);
      rows($('pages'), pages || [], pageLabel);
      rows($('countries'), countries || [], (c) => esc(regionName(c)));
      rows($('devices'), devices || [], (d) => esc(DEVICES[d] || d));
      $('updated').textContent = 'עודכן ' + new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) + ' · מתעדכן לבד כל דקה';
    } catch (e) {
      $('updated').innerHTML = `<span class="err">שגיאה בטעינה (${esc(e.message)}). נסה רענון.</span>`;
    }
  }

  document.querySelectorAll('[data-range]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-range]').forEach((x) => x.classList.toggle('on', x === b));
    range = b.dataset.range; load();
  }));
  $('refresh').addEventListener('click', load);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden) load(); }, 60000);
  load();
})();
</script>
</body>
</html>
